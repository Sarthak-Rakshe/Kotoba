services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: kotoba-backend
    restart: unless-stopped
    ports:
      - "5277:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kotoba-network

  postgres:
    image: postgres:16-alpine
    container_name: kotoba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kotoba_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kotoba_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kotoba-network

networks:
  kotoba-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
